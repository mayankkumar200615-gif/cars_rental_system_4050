<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment_mode</title>
    <link rel="stylesheet" href="payment.css">
</head>

<body>
    <img src="pictures/payment_c.png" alt="payment">
    <!-- Main Payment Section -->
    <main class="container">

        <div class="payment-card">
            <!-- Title -->
            <div class="title">
                <h1>Make a Payment</h1>
                <p>
                    Complete your payment securely
                </p>
            </div>

            <!-- Amount -->
            <div class="amount-box">
                <div class="amount-label">
                    Amount to Pay
                </div>

                <div class="amount">
                    ₹1,000
                </div>

                <!-- Customer Details -->
                <div class="form-group">
                    <label for="name"> Customer Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <!-- Payment Methods -->

                <div class="method-title">Select Payment Method</div>

                <div class="methods">
                    <div class="method active" onclick="selectMethod(this)">

                        <div class="method-name">UPI</div>
                    </div>
                </div>
                <div class="method" onclick="" selectMethod(this)>
                    <div class="method-icon"> 💳 </div>
                    <div class="method-name"> Card </div>
                </div>
                <div class="method" onclick="selectMethod(this)">
                    <div class="method-icon"> 🏦 </div>
                    <div class="method-name"> Net Banking </div>
                </div>
                <br>
                <!-- PAY BUTTON -->
                <button class="pay-button" onclick="makePayment()"> Pay ₹1,000 </button>
                <!-- SECURITY -->
                <div class="security"> 🔒 Your payment information is secure and encrypted.</div>
            </div>
        </div>



        </div>

        </div>





    </main>


</body>

</html>
